# Runs every server test suite on each push and pull request, against
# stand-in AI, email and payment services (see scripts/dev/ci.sh).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Test suites
        run: bash scripts/dev/ci.sh
